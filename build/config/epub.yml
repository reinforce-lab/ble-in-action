# Pandoc Defaults for EPUB Build
# Usage: pandoc --defaults=build/config/epub.yml <input files>

# Input format
from: markdown+smart+footnotes+fenced_code_blocks+inline_code_attributes+pipe_tables

# Output format
to: epub3
standalone: true

# Metadata
metadata-file: manuscript/metadata.yml

# Content processing
number-sections: true
toc: true
toc-depth: 2
file-scope: false

# Code highlighting
highlight-style: tango

# EPUB-specific
split-level: 2

# Styling
css: build/templates/epub-styles.css

# Math
mathml: true

# Resource paths
resource-path:
  - .
  - manuscript
  - manuscript/images
