# Pandoc Build Configuration
# This file defines how Pandoc converts manuscript to various formats

# Global Pandoc options (apply to all formats)
defaults:
  # Input/Output
  from: markdown+smart+footnotes+fenced_code_blocks+inline_code_attributes+pipe_tables
  standalone: true
  
  # Content processing
  number-sections: true
  toc: true
  toc-depth: 2
  
  # Metadata
  metadata-file: manuscript/metadata.yml
  
  # Extensions
  file-scope: false  # Allow cross-file references
  
  # Filters (if any)
  # filters:
  #   - pandoc-crossref  # For figure/table references
  
  # Code highlighting
  highlight-style: tango
  
  # Templates directory
  resource-path:
    - .
    - manuscript
    - manuscript/images

# EPUB-specific configuration
epub:
  to: epub3
  epub-chapter-level: 2
  epub-cover-image: manuscript/images/cover.png
  css: build/templates/epub-styles.css
  
  # EPUB validation
  epub-subdirectory: EPUB
  
  # Fonts (embedded in EPUB)
  # epub-embed-font:
  #   - fonts/NotoSansCJKjp-Regular.otf
  #   - fonts/NotoSerifCJKjp-Regular.otf

# PDF-specific configuration
pdf:
  to: latex
  pdf-engine: xelatex
  
  # LaTeX template customization
  template: default.latex  # Use pandoc's default
  include-in-header: build/templates/latex-preamble.tex
  
  # Japanese fonts (from metadata.yml)
  # mainfont, CJKmainfont, monofont are set in metadata.yml
  
  # Page layout
  documentclass: book
  classoption:
    - oneside
    - 11pt
  papersize: a5  # Amazon KDP standard
  geometry:
    - margin=2cm
    - top=2.5cm
    - bottom=2.5cm
  
  # Typography
  linestretch: 1.2
  fontsize: 11pt
  
  # Links
  colorlinks: true
  linkcolor: blue
  urlcolor: blue
  
  # Code blocks
  listings: true

# Validation configuration
validation:
  # Use epubcheck for EPUB validation
  epub-validator: epubcheck
  
  # Validation options
  validation-level: strict
  
  # Output validation report
  validation-report: output/validation-reports/validation.txt
